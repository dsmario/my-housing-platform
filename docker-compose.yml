# Local app stack (walking skeleton). Run: docker compose up --build
# Then open http://localhost:3000
#
# Credentials below are for local development only and never leave this machine.
# Sign-in uses the dev Cognito pool; its settings come from .env (see .env.example).

services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: mhp
      POSTGRES_USER: mhp
      POSTGRES_PASSWORD: mhp-local-only
    ports:
      - "127.0.0.1:5432:5432"   # this machine only, for database tools
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mhp -d mhp"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./app/api
    environment:
      DATABASE_URL: postgresql://mhp:mhp-local-only@db:5432/mhp
      IDENTITY_PROVIDER: cognito
      SEED_DATA: "true"
      COGNITO_ISSUER: ${AUTH_COGNITO_ISSUER:?set in .env}
      COGNITO_CLIENT_ID: ${AUTH_COGNITO_ID:?set in .env}
    ports:
      - "8000:8000"   # API docs at http://localhost:8000/docs
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./app/web
    environment:
      API_URL: http://api:8000
      AUTH_URL: http://localhost:3000/auth
      AUTH_SECRET: ${AUTH_SECRET:?set in .env}
      AUTH_COGNITO_ID: ${AUTH_COGNITO_ID:?set in .env}
      AUTH_COGNITO_SECRET: ${AUTH_COGNITO_SECRET:?set in .env}
      AUTH_COGNITO_ISSUER: ${AUTH_COGNITO_ISSUER:?set in .env}
      AUTH_COGNITO_DOMAIN: ${AUTH_COGNITO_DOMAIN:?set in .env}
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Local stand-in for SQS. Not used by the skeleton yet; ready for the Doc Vault upload flow.
  queue:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "9325:9325"   # web UI

volumes:
  pgdata:
